<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>音乐播放器 · 星澜聚合音源</title>
  <style>
    :root {
      --ink: #16304a;
      --muted: rgba(22, 48, 74, 0.62);
      --faint: rgba(22, 48, 74, 0.4);
      --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.46) 0%, rgba(255, 255, 255, 0.16) 42%, rgba(255, 255, 255, 0.22) 100%);
      --glass-2: linear-gradient(165deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.12) 48%, rgba(255, 255, 255, 0.2) 100%);
      --stroke: rgba(255, 255, 255, 0.55);
      --inset: rgba(255, 255, 255, 0.72);
      --accent: #ff5d8f;
      --accent-2: #b48cff;
      --blob: rgba(255, 93, 143, 0.26);
      --list-bg: rgba(255, 255, 255, 0.26);
      --toast-bg: rgba(26, 34, 48, 0.78);
      --toast-ink: #f4f8ff;
      --btn-fg: #f4f8ff;
      --h: 470px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #eef4ff;
        --muted: rgba(226, 236, 255, 0.62);
        --faint: rgba(226, 236, 255, 0.38);
        --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(18, 28, 48, 0.22) 46%, rgba(255, 255, 255, 0.08) 100%);
        --glass-2: linear-gradient(165deg, rgba(255, 255, 255, 0.18) 0%, rgba(16, 24, 42, 0.28) 50%, rgba(255, 255, 255, 0.07) 100%);
        --stroke: rgba(255, 255, 255, 0.22);
        --inset: rgba(255, 255, 255, 0.28);
        --accent: #ff6f9c;
        --accent-2: #c9a4ff;
        --blob: rgba(255, 111, 156, 0.3);
        --list-bg: rgba(255, 255, 255, 0.1);
        --toast-bg: rgba(238, 243, 251, 0.82);
        --toast-ink: #121826;
        --btn-fg: #121826;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0 5px;
      height: var(--h);
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font: 13px/1.3 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .card {
      position: relative;
      height: var(--h);
      min-height: var(--h);
      max-height: var(--h);
      padding: 8px 12px 10px;
      border-radius: 26px;
      background: var(--glass);
      border: 1px solid var(--stroke);
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow:
        inset 0 1px 0 var(--inset),
        inset 0 -0.5px 0 rgba(255, 255, 255, 0.12),
        0 0 0 0.5px rgba(255, 255, 255, 0.28);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(90% 52% at 88% -8%, var(--blob), transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 30%);
      -webkit-backdrop-filter: blur(28px) saturate(1.7);
      backdrop-filter: blur(28px) saturate(1.7);
    }

    /* ---------- 搜索行 ---------- */
    .search {
      position: relative;
      z-index: 2;
      flex: none;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .field {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-radius: 12px;
      background: var(--glass-2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    @media (prefers-color-scheme: dark) {
      .field { border-color: rgba(255, 255, 255, 0.14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16); }
    }
    .field svg { flex: none; width: 14px; height: 14px; opacity: 0.55; }
    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      -webkit-user-select: text;
      user-select: text;
    }
    .field input::placeholder { color: var(--faint); }
    .clear {
      flex: none;
      width: 16px; height: 16px;
      border: 0; padding: 0;
      border-radius: 50%;
      background: rgba(120, 130, 150, 0.28);
      color: #fff;
      font-size: 11px;
      line-height: 16px;
      cursor: pointer;
      display: none;
    }
    .clear.on { display: block; }

    select.sel {
      flex: none;
      height: 32px;
      max-width: 96px;
      padding: 0 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: var(--glass-2);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    @media (prefers-color-scheme: dark) { select.sel { border-color: rgba(255,255,255,0.14); } }

    /* ---------- 主信息区 ---------- */
    .main {
      position: relative;
      z-index: 1;
      flex: none;
      display: grid;
      grid-template-columns: 116px 1fr;
      align-items: center;
      gap: 10px;
    }
    .cover {
      position: relative;
      width: 116px;
      height: 116px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(145deg, #ffb1c9, #b48cff 55%, #7ec4ff);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -0.5px 0 rgba(255, 255, 255, 0.2),
        0 8px 18px rgba(40, 60, 110, 0.24);
    }
    @media (prefers-color-scheme: dark) {
      .cover { box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,14,28,0.5); }
    }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover .disc {
      position: absolute; inset: 0;
      display: grid; place-content: center; gap: 3px;
      text-align: center; color: #fff;
      text-shadow: 0 1px 3px rgba(20, 30, 60, 0.5);
    }
    .cover .disc .note { font-size: 38px; line-height: 1; }
    .cover .disc .sub { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }

    .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-right: 4px; }
    .title {
      font-size: 17px; font-weight: 750; letter-spacing: 0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
    }
    .artist {
      font-size: 12.5px; font-weight: 600; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    @media (prefers-color-scheme: dark) { .title { text-shadow: 0 1px 3px rgba(8,14,28,0.7); } }
    .lyric {
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--faint);
      height: 15px;
      line-height: 15px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tags { margin-top: 2px; display: flex; gap: 4px; flex-wrap: wrap; }
    .tag {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: rgba(255, 255, 255, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--muted);
      white-space: nowrap;
    }
    .tag.hot {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      color: #fff;
    }
    @media (prefers-color-scheme: dark) {
      .tag { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.1); }
    }

    /* ---------- 进度条 ---------- */
    .bar { position: relative; z-index: 1; flex: none; height: 18px; display: flex; align-items: center; gap: 8px; }
    .time {
      flex: none; font-size: 11px; font-weight: 650; color: var(--muted);
      font-variant-numeric: tabular-nums; min-width: 34px;
    }
    .time.r { text-align: right; }
    .track {
      position: relative; flex: 1; height: 8px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      overflow: hidden; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      .track { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.12); }
    }
    .fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 10px rgba(255, 93, 143, 0.5);
    }
    .knob {
      position: absolute; top: 50%; left: 0%;
      width: 12px; height: 12px; border-radius: 50%; background: #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 4px rgba(20,30,60,0.4), inset 0 1px 0 rgba(255,255,255,0.9);
      pointer-events: none;
    }

    /* ---------- 控制 ---------- */
    .controls {
      position: relative; z-index: 1; flex: none; height: 42px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 4px;
    }
    .btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--stroke);
      background: var(--glass-2);
      box-shadow: inset 0 1px 0 var(--inset), 0 4px 12px rgba(40, 60, 110, 0.18);
      display: grid; place-content: center;
      cursor: pointer; color: var(--ink);
      transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.94); }
    .btn svg { width: 17px; height: 17px; }
    .btn.play {
      width: 42px; height: 42px;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      border: none; color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 8px 18px rgba(255, 93, 143, 0.4);
    }
    .btn.play svg { width: 19px; height: 19px; }
    .btn.on { color: var(--accent); }
    .group { display: flex; align-items: center; gap: 8px; }

    /* ---------- 结果列表 ---------- */
    .results {
      position: relative; z-index: 1;
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      background: var(--glass-2);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      backdrop-filter: blur(16px) saturate(1.4);
    }
    @media (prefers-color-scheme: dark) {
      .results { border-color: rgba(255,255,255,0.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); }
    }
    .rhead {
      flex: none;
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px 4px;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--faint);
    }
    .rlist {
      flex: 1; min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 4px 5px;
      scrollbar-width: thin;
    }
    .rlist::-webkit-scrollbar { width: 4px; }
    .rlist::-webkit-scrollbar-thumb { background: rgba(120, 130, 150, 0.35); border-radius: 4px; }
    .item {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 11px;
      cursor: pointer;
      min-width: 0;
    }
    .item:hover { background: rgba(255, 255, 255, 0.24); }
    .item.on { background: rgba(255, 255, 255, 0.4); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55); }
    @media (prefers-color-scheme: dark) {
      .item:hover { background: rgba(255,255,255,0.09); }
      .item.on { background: rgba(255,255,255,0.14); box-shadow: none; }
    }
    .item .idx {
      font-size: 11px; font-weight: 700; color: var(--faint);
      font-variant-numeric: tabular-nums; text-align: center;
    }
    .item.on .idx { color: var(--accent); }
    .item .meta { min-width: 0; }
    .item .nm {
      font-size: 12.5px; font-weight: 650;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item .ar {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item .src {
      flex: none;
      font-size: 9.5px; font-weight: 700;
      padding: 2px 6px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.36);
      color: var(--muted);
      white-space: nowrap;
    }
    @media (prefers-color-scheme: dark) { .item .src { background: rgba(255,255,255,0.12); } }

    .empty {
      flex: 1; display: grid; place-content: center; gap: 6px;
      text-align: center; color: var(--faint); font-size: 12px; padding: 10px;
    }
    .spin {
      width: 18px; height: 18px; margin: 0 auto;
      border: 2px solid rgba(120, 130, 150, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: sp 0.8s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    .dots { display: flex; gap: 5px; justify-content: center; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); animation: pulse 1s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    #toast {
      position: fixed;
      left: 50%; top: 12px;
      transform: translateX(-50%) translateY(-8px);
      max-width: 84%;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--toast-bg);
      color: var(--toast-ink);
      font-size: 12px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 9;
    }
    #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="search">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/>
        </svg>
        <input id="q" type="search" placeholder="搜索歌曲 / 歌手，回车确认" autocomplete="off">
        <button class="clear" id="clear" type="button" title="清空">&#10005;</button>
      </div>
      <select class="sel" id="qSel" title="音质">
        <option value="128k">标准</option>
        <option value="320k" selected>高品</option>
        <option value="flac">无损</option>
      </select>
      <select class="sel" id="stgSel" title="音源策略" style="max-width:78px">
        <option value="auto" selected>自动</option>
        <option value="gd">GD</option>
        <option value="bugpk">bugpk</option>
        <option value="cenguigui">笒鬼鬼</option>
        <option value="stellar">星澜</option>
      </select>
    </div>

    <div class="main">
      <div class="cover">
        <img id="coverImg" class="hidden" alt="">
        <div class="disc" id="coverDisc">
          <div class="note">&#9835;</div>
          <div class="sub">MUSIC</div>
        </div>
      </div>
      <div class="info">
        <div class="title" id="mTitle">未播放</div>
        <div class="artist" id="mArtist">搜索一首歌开始</div>
        <div class="lyric" id="lyric"></div>
        <div class="tags" id="tags"></div>
      </div>
    </div>

    <div class="bar">
      <div class="time" id="tCur">0:00</div>
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="time r" id="tDur">0:00</div>
    </div>

    <div class="controls">
      <div class="group">
        <button class="btn" id="btnPrev" title="上一曲" aria-label="上一曲">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM19 6v12l-9-6z"/></svg>
        </button>
        <button class="btn play" id="btnPlay" title="播放/暂停" aria-label="播放/暂停">
          <svg viewBox="0 0 24 24" fill="currentColor"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn" id="btnNext" title="下一曲" aria-label="下一曲">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 6l9 6-9 6zM15 6h2v12h-2z"/></svg>
        </button>
      </div>
      <div class="group">
        <button class="btn" id="btnShuffle" title="随机播放" aria-label="随机播放">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 7h3l4-4M14 17h3l4 4"/></svg>
        </button>
        <button class="btn" id="btnPick" title="添加本地音乐" aria-label="添加本地音乐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="results">
      <div class="rhead" id="rhead">播放列表</div>
      <div class="rlist" id="rlist"></div>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <input type="file" id="file" accept="audio/*" multiple class="hidden">

  <script>
/*!
 * @name 星澜聚合音源 (StellarWave)
 * @description 基于墨澜 v2.3.1 与星澜 v3.1.1.1 融合，删除失效 API，新增 FFAPI，智能缓存 + 并发 Fallback，支持母带/全景声
 * @version v3.2.0
 * @author 星澜团队
 * @homepage https://github.com/your-repo/StellarWave
 * @license MIT
 * @update 2026-08-17
 * @changelog
 *   - 深度融合墨澜 v2.3.1 后端池（含 ikun、Hello World、长青海棠等）
 *   - 保留 QQ越权（3重策略）、ygking、残像、星海聚合、yunmge、念心等
 *   - 引入星澜 LRU 缓存 + 并发/顺序 Fallback
 *   - 提升高音质获取成功率
 *   - 清理重复及失效后端
 * @tx_cookie null
 * @wy_cookie null
 */
;
/* ================== 浏览器适配层 ================== */
/* ==========================================================================
 * 浏览器适配层 —— 用浏览器原生能力补齐 LX Music 宿主 globalThis.lx
 * --------------------------------------------------------------------------
 * 原音源脚本依赖宿主提供：request / utils.crypto(md5,aesEncrypt) / utils.buffer
 * / env / version / currentScriptInfo / on / send / EVENT_NAMES
 * 这里全部用纯前端实现替代，脚本主体保持原样运行。
 * ========================================================================== */

'use strict';

/* ---------- LX 宿主常量与事件 ---------- */

var EVENT_NAMES = { request: 'request', inited: 'inited' };
var env = 'browser';
var version = null;   // 置空 → 脚本内的 aesEncrypt / buf2hex 走纯 JS 兜底分支
var currentScriptInfo = {
  rawScript: (typeof document !== 'undefined' && document.currentScript)
    ? document.currentScript.textContent || ''
    : ''
};

var __lxRequestHandler = null;   // 由原脚本 on(EVENT_NAMES.request) 注册
var __lxInitedPayload = null;    // 由原脚本 send(EVENT_NAMES.inited) 写入

function on(name, fn) { if (name === EVENT_NAMES.request) __lxRequestHandler = fn; }
function send(name, data) { if (name === EVENT_NAMES.inited) __lxInitedPayload = data; }
function request(url, options, cb) {   // 保留宿主签名，实际请求统一走 __bf
  __bf(url, options || {}).then(function (r) { cb(null, r); }, function (e) { cb(e); });
}

/* ---------- MD5（纯 JS，兼容中文 UTF-8） ---------- */

var MD5_S = [
  7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
  5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
  4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
  6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
];
var MD5_K = (function () {
  var k = new Array(64);
  for (var i = 0; i < 64; i++) k[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) >>> 0;
  return k;
})();

function md5SafeAdd(x, y) {
  var lsw = (x & 0xffff) + (y & 0xffff);
  var msw = (x >> 16) + (y >> 16) + (lsw >> 16);
  return ((msw << 16) | (lsw & 0xffff)) | 0;
}
function md5Rol(num, cnt) { return ((num << cnt) | (num >>> (32 - cnt))) | 0; }

function md5hex(message) {
  var bytes = new TextEncoder().encode(String(message));
  var n = bytes.length;
  var blocks = ((n + 8) >> 6) + 1;
  var buf = new Uint8Array(blocks * 64);

// ==================== 缓存系统（LRU + TTL） ====================

const CACHE_TTL_MS = 21600000 // 6 小时
const CACHE_MAX_SIZE = 300
const urlCache = new Map()

const getCachedUrl = (key) => {
  const entry = urlCache.get(key)
  if (!entry) return null
  if (Date.now() - entry.timestamp > CACHE_TTL_MS) {
    urlCache.delete(key)
    return null
  }
  return entry.url
}

const setCachedUrl = (key, url) => {
  urlCache.set(key, { url, timestamp: Date.now() })
  if (urlCache.size > CACHE_MAX_SIZE) {
    const oldest = urlCache.keys().next().value
    if (oldest) urlCache.delete(oldest)
  }
}

// ==================== 核心请求函数（缓存 + 并发Fallback） ====================

const handleGetMusicUrl = async (source, musicInfo, quality) => {
  const songId = musicInfo.hash ?? musicInfo.songmid ?? musicInfo.id
  if (!songId) throw new Error('无法获取歌曲ID')

  const supported = MUSIC_QUALITY[source] || ['128k']
  const targetQuality = supported.includes(quality) ? quality : (supported[supported.length - 1] || '128k')

  const cacheKey = buildCacheKey(source, songId, targetQuality)
  const cached = getCachedUrl(cacheKey)
  if (cached) {
    console.log(`[星澜] 缓存命中: ${source} ${songId} ${targetQuality}`)
    return cached
  }

  const backends = {
    tx: TX_BACKENDS,
    wy: WY_BACKENDS,
    kw: KW_BACKENDS,
    kg: KG_BACKENDS,
    mg: MG_BACKENDS,
  }[source]

  if (!backends) throw new Error('未知音源: ' + source)

  const errors = []
  const total = backends.length

  // 并发尝试前 3 个
  const firstTier = backends.slice(0, 3)
  try {
    const result = await Promise.any(firstTier.map(async (backend) => {
      const url = await backend.fetch(songId, targetQuality, musicInfo)
      if (url && typeof url === 'string' && (url.startsWith('http://') || url.startsWith('https://'))) {
        return url
      }
      throw new Error(`${backend.name} 返回无效URL`)
    }))
    setCachedUrl(cacheKey, result)
    return result
  } catch (err) {
    if (err.errors) {
      err.errors.forEach(e => errors.push(e.message || e))
    } else {
      errors.push(err.message)
    }
  }

  // 顺序尝试剩余后端
  for (const backend of backends.slice(3)) {
    try {
      const url = await backend.fetch(songId, targetQuality, musicInfo)
      if (url && typeof url === 'string' && (url.startsWith('http://') || url.startsWith('https://'))) {
        setCachedUrl(cacheKey, url)
        return url
      }
      errors.push(`${backend.name}: 返回无效URL`)
    } catch (e) {
      errors.push(`${backend.name}: ${e.message}`)
    }
  }

  throw new Error(`所有后端均失败（共 ${total} 个）\n${errors.join('\n')}`)
}

// ==================== 注册请求事件 ====================

on(EVENT_NAMES.request, ({ action, source, info }) => {
  switch (action) {
    case 'musicUrl':
      return handleGetMusicUrl(source, info.musicInfo, info.type)
        .then(data => Promise.resolve(data))
        .catch(err => Promise.reject(err))
    default:
      return Promise.reject('action not support: ' + action)
  }
})

    };
    return __lxRequestHandler({ action: 'musicUrl', source: source, info: { musicInfo: musicInfo, type: q } })
      .then(function (u) {
        if (u && /^https?:/.test(u)) return { url: u, via: '星澜聚合' };
        throw new Error('星澜返回无效链接');
      });
  }

  function getUrl(song, q) {
    if (song.url) return Promise.resolve({ url: song.url, via: song.source === 'local' ? '本地文件' : '缓存' });
    var strategy = $('stgSel').value;
    var chain;
    if (strategy === 'gd') chain = [viaGD];
    else if (strategy === 'bugpk') chain = [viaBugpk];
    else if (strategy === 'cenguigui') chain = [viaCenguigui];
    else if (strategy === 'stellar') chain = [viaStellar];
    else chain = [viaGD, viaBugpk, viaCenguigui, viaStellar];  // 自动：先快后慢

    var i = 0;
    var errors = [];
    function next() {
      if (i >= chain.length) return Promise.reject(new Error(errors.join(' / ') || '全部通道失败'));
      var fn = chain[i++];
      return fn(song, q).catch(function (e) {
        errors.push(e.message || String(e));
        return next();
      });
    }
    return next();
  }

  /* ---------------- 封面 / 歌词 ---------------- */

  function loadCover(song) {
    var img = $('coverImg'), disc = $('coverDisc');
    if (!song || !song.picId) {
      img.classList.add('hidden'); img.removeAttribute('src');
      disc.classList.remove('hidden');
      return;
    }
    race(GD_HOSTS, function (h) {
      return h + '/api.php?types=pic&source=netease&id=' + encodeURIComponent(song.picId) + '&size=300';
    }).then(function (d) {
      if (d && d.url) { img.src = d.url; img.classList.remove('hidden'); disc.classList.add('hidden'); }
    }).catch(function () {
      img.classList.add('hidden'); disc.classList.remove('hidden');
    });
  }

  function parseLrc(text) {
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var m = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/.exec(line);
      if (!m) return;
      var t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + (m[3] ? parseInt(m[3], 10) / 1000 : 0);
      var txt = line.replace(/\[[^\]]*\]/g, '').trim();
      if (txt) out.push([t, txt]);
    });
    out.sort(function (a, b) { return a[0] - b[0]; });
    return out;
  }

  function loadLyric(song) {
    lyricLines = [];
    $('lyric').textContent = '';
    if (!song || !song.lyricId) return;
    race(GD_HOSTS, function (h) {
      return h + '/api.php?types=lyric&source=netease&id=' + encodeURIComponent(song.lyricId);
    }).then(function (d) {
      if (d && d.lyric) lyricLines = parseLrc(d.lyric);
    }).catch(function () {});
  }

  function syncLyric(t) {
    if (!lyricLines.length) { $('lyric').textContent = ''; return; }
    var cur = '';
    for (var i = 0; i < lyricLines.length; i++) {
      if (lyricLines[i][0] <= t + 0.3) cur = lyricLines[i][1]; else break;
    }
    $('lyric').textContent = cur;
  }

  /* ---------------- 播放 ---------------- */

  function setTags(song, via) {
    var html = '';
    if (song && song.source) {
      html += '<span class="tag hot">' + esc(SRC_LABEL[song.source] || song.source) + '</span>';
    }
    html += '<span class="tag">' + esc(QUALITY_LABEL[$('qSel').value] || $('qSel').value) + '</span>';
    if (via) html += '<span class="tag">' + esc(via) + '</span>';
    $('tags').innerHTML = html;
  }

  function play(i) {
    if (i < 0 || i >= queue.length) return;
    idx = i;
    var song = queue[i];
    $('mTitle').textContent = song.name;
    $('mArtist').textContent = song.artist || '未知歌手';
    setTags(song, '');
    loadCover(song);
    loadLyric(song);
    renderList(queue, 'list');
    resetBar();

    if (song.url) { startPlay(song.url, song.source === 'local' ? '本地文件' : '缓存'); return; }

    $('mArtist').textContent = (song.artist || '未知歌手') + ' · 解析中…';
    getUrl(song, $('qSel').value).then(function (r) {
      if (idx !== i) return;                 // 已切换歌曲，丢弃过期结果
      song.url = r.url;
      startPlay(r.url, r.via);
    }).catch(function (e) {
      if (idx !== i) return;
      $('mArtist').textContent = (song.artist || '未知歌手') + ' · 解析失败';
      toast('解析失败：' + (e.message || '无可用音源'));
      setTags(song, '失败');
    });
  }

  function startPlay(url, via) {
    var song = queue[idx];
    audio.src = url;
    $('mArtist').textContent = (song && song.artist) || '未知歌手';
    if (song) setTags(song, via);
    audio.play().catch(function () { toast('播放失败，可能是版权或链接失效'); });
  }

  function resetBar() {
    $('fill').style.width = '0%';
    $('knob').style.left = '0%';
    $('tCur').textContent = '0:00';
    $('tDur').textContent = '0:00';
  }

  function renderPlayIcon() {
    $('playIcon').setAttribute('d', audio.paused ? 'M8 5v14l11-7z' : 'M6 5h4v14H6zM14 5h4v14h-4z');
  }

  function step(dir) {
    if (!queue.length) return -1;
    if (shuffle) {
      var r = Math.floor(Math.random() * queue.length);
      if (queue.length > 1 && r === idx) r = (r + 1) % queue.length;
      return r;
    }
    return (idx + dir + queue.length) % queue.length;
  }

  /* ---------------- 列表渲染 ---------------- */

  function renderList(list, mode) {
    var box = $('rlist'), head = $('rhead');
    if (mode === 'searching') {
      head.textContent = '搜索中…';
      box.innerHTML = '<div class="empty"><div class="spin"></div><div>正在搜索</div></div>';
      return;
    }
    if (mode === 'empty' || !list || !list.length) {
      head.textContent = '播放列表';
      box.innerHTML = '<div class="empty"><div>搜索框输入歌名开始</div>' +
        '<div style="font-size:11px;opacity:.8">支持歌名 / 歌手，回车搜索</div></div>';
      return;
    }
    head.textContent = '播放列表 · ' + list.length + ' 首';
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      html += '<div class="item' + (i === idx ? ' on' : '') + '" data-i="' + i + '">' +
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="meta"><span class="nm">' + esc(it.name) + '</span>' +
        '<span class="ar">' + esc(it.artist || '未知歌手') + (it.album ? ' · ' + esc(it.album) : '') + '</span></span>' +
        '<span class="src">' + esc(SRC_LABEL[it.source] || it.source) + '</span>' +
        '</div>';
    }
    box.innerHTML = html;
  }

  /* ---------------- 事件 ---------------- */

  audio.addEventListener('play', renderPlayIcon);
  audio.addEventListener('pause', renderPlayIcon);
  audio.addEventListener('loadedmetadata', function () { $('tDur').textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function () {
    if (!isFinite(audio.duration) || !audio.duration) return;
    var p = audio.currentTime / audio.duration * 100;
    $('fill').style.width = p + '%';
    $('knob').style.left = p + '%';
    $('tCur').textContent = fmt(audio.currentTime);
    syncLyric(audio.currentTime);
  });
  audio.addEventListener('ended', function () {
    var t = step(1);
    if (t >= 0) play(t);
  });
  audio.addEventListener('error', function () {
    if (audio.src) toast('播放出错，尝试下一首或换音源');
  });

  $('btnPlay').addEventListener('click', function () {
    if (!queue.length) { toast('先搜索一首歌'); $('q').focus(); return; }
    if (idx < 0) { play(0); return; }
    if (audio.paused) audio.play().catch(function () { toast('无法播放'); });
    else audio.pause();
  });
  $('btnNext').addEventListener('click', function () { var t = step(1); if (t >= 0) play(t); });
  $('btnPrev').addEventListener('click', function () {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    var t = step(-1); if (t >= 0) play(t);
  });
  $('btnShuffle').addEventListener('click', function () {
    shuffle = !shuffle;
    this.classList.toggle('on', shuffle);
    toast(shuffle ? '随机播放已开' : '随机播放已关');
  });
  $('btnPick').addEventListener('click', function () { $('file').click(); });

  $('rlist').addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.item') : null;
    if (!el) return;
    play(parseInt(el.getAttribute('data-i'), 10));
  });

  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doSearch(this.value);
    $('clear').classList.toggle('on', !!this.value);
  });
  $('q').addEventListener('input', function () { $('clear').classList.toggle('on', !!this.value); });
  $('clear').addEventListener('click', function () {
    $('q').value = ''; this.classList.remove('on'); $('q').focus();
  });
  $('qSel').addEventListener('change', function () {
    // 换音质后清空当前直链缓存，下次播放重新解析
    if (idx >= 0 && queue[idx] && queue[idx].source !== 'local') queue[idx].url = '';
    toast('音质：' + QUALITY_LABEL[this.value]);
  });

  $('file').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files);
    if (!files.length) return;
    var base = queue.length;
    files.forEach(function (f, k) {
      queue.push({
        id: 'local-' + base + '-' + k,
        name: f.name.replace(/\.[^.]+$/, ''),
        artist: '本地文件', album: '', source: 'local',
        url: URL.createObjectURL(f), picId: '', lyricId: ''
      });
    });
    renderList(queue, 'list');
    toast('已加入 ' + files.length + ' 首');
    e.target.value = '';
  });

  $('track').addEventListener('click', function (e) {
    if (!isFinite(audio.duration) || !audio.duration) return;
    var r = this.getBoundingClientRect();
    var p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    audio.currentTime = p * audio.duration;
  });

  // 星澜音源加载情况
  setTimeout(function () {
    if (__lxInitedPayload && __lxInitedPayload.sources) {
      var n = Object.keys(__lxInitedPayload.sources).length;
      console.log('[星澜] 浏览器适配层就绪，已注册音源 ' + n + ' 个');
    }
    reportHeight();
  }, 300);

  renderList([], 'empty');
  renderPlayIcon();
})();

  </script>
</body>
</html>
